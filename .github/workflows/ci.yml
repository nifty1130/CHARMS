name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # WebRTC の結合テストを実際のブラウザで動かすために必要
      - run: npx playwright install --with-deps chromium

      - name: 型チェック
        run: npm run check

      - name: テスト
        run: npm test

      - name: ビルド
        run: npm run build
