name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型チェック・テスト・ビルド
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # WebRTC の結合テストと画面操作のテストを、実際のブラウザで動かすために必要
      - run: npx playwright install --with-deps chromium

      - name: 型チェック
        run: npm run check

      - name: 単体テスト・結合テスト
        run: npm test

      # ビルドした本番用のファイルを配信し、ホストと各端末の画面を実際に操作して確かめる
      - name: 画面操作のテスト（E2E）
        run: npm run test:e2e

      - name: 失敗したテストの記録を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
