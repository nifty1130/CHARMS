name: Deploy

# main ブランチに入った内容を、GitHub Pages に公開する。
# 公開された URL を各端末で一度開けば、当日はインターネットなしで使える。
#
# 公開するかどうかは、リポジトリの変数 DEPLOY_PAGES で決める（README の「公開の手順」を参照）。
# 変数を設定していない間は、このワークフローは何もしない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    if: ${{ vars.DEPLOY_PAGES == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages では https://<ユーザー名>.github.io/<リポジトリ名>/ で配信されるので、
      # リポジトリ名をサブフォルダとして指定してビルドする
      - name: ビルド
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
