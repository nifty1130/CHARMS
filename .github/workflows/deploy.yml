name: Deploy

# main ブランチに入った内容を、Cloudflare Workers（https://charmpoint.nifty1130.com）に公開する。
#
# 自動で公開するかどうかは、リポジトリの変数 DEPLOY_CLOUDFLARE で決める（README の「公開の手順」を参照）。
# 変数を設定していない間は、このワークフローは何もしない（手元から npm run deploy で公開する）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: 公開
    if: ${{ vars.DEPLOY_CLOUDFLARE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ビルド
        run: npm run build

      # 公開先と設定は wrangler.jsonc にある
      - name: Cloudflare に公開
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
